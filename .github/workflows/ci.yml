name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Installed rather than declared as tools in go.mod: the projects that
      # import magox would get them in their module graph
      - name: Tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/tools/gopls@v0.23.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Quality
        run: go tool mage check
      - name: Tests
        run: go tool mage coverage
      - name: Hints
        run: go tool mage hints
